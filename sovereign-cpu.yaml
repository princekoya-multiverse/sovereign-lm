---
version: "2.0"
services:
  lm:
    image: warriorworld/sovereign-lm:cpu-7b-20261101
    env:
      - SOVEREIGN_API_KEY=${SOVEREIGN_API_KEY}
      - LLAMA_THREADS=4
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
        http_options:
          max_body_size: 10485760
          read_timeout: 300000
          send_timeout: 300000
profiles:
  compute:
    lm:
      resources:
        cpu:
          units: 4.0
        memory:
          size: 12Gi
        storage:
          size: 20Gi
  placement:
    cpu:
      pricing:
        lm:
          denom: uakt
          amount: 4000  # ~$4/mo budget-fit always-on sovereign CPU box
deployment:
  lm:
    cpu:
      profile: lm
      count: 1